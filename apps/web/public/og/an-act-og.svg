<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AN ACT  Where professional requirement becomes trusted action">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="55%" stop-color="#101010"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#3ecf8e" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#2a9d63" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="keyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="24" flood-color="#3ecf8e" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g filter="url(#keyShadow)">
    <rect x="430" y="150" width="340" height="140" rx="22" fill="#141414" stroke="#2a2a2a" stroke-width="2"/>
    <rect x="430" y="150" width="340" height="28" rx="22" fill="#1f1f1f"/>
    <text x="600" y="245" text-anchor="middle" fill="#ffffff" font-family="SF Mono, Menlo, Consolas, monospace" font-size="52" letter-spacing="0.1em">an act</text>
  </g>
  <text x="600" y="380" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="44" font-weight="600" letter-spacing="-0.02em">AN ACT</text>
  <text x="600" y="430" text-anchor="middle" fill="#b8b8b8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" letter-spacing="0.01em">Where professional requirement becomes trusted action.</text>
  <text x="600" y="520" text-anchor="middle" fill="#3ecf8e" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" letter-spacing="0.14em">ENTERPRISE RUNTIME � LIVE FRAME � TRUST ARCHITECTURE</text>
